name: CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app tests scripts

      - name: Run backend tests with coverage
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend - JavaScript and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find frontend -type f -name "*.js" -not -path "*/node_modules/*" -print0)

      - name: Run frontend smoke tests
        run: node --test frontend/tests/*.test.js

  docker:
    name: Docker - full stack integration smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI-only environment
        shell: bash
        run: |
          {
            echo "POSTGRES_DB=chodocu"
            echo "POSTGRES_USER=chodocu"
            echo "POSTGRES_PASSWORD=ci-only-password-not-for-deployment"
            echo "JWT_SECRET_KEY=$(openssl rand -hex 32)"
          } > .env

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build and start the complete stack
        run: docker compose up -d --build

      - name: Wait for frontend and API health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8080/
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8080/health
          curl --fail --silent --show-error http://localhost:8080/openapi.json -o /tmp/openapi.json
          grep -q '"openapi"' /tmp/openapi.json
          grep -q '"/api/v1/auth/login"' /tmp/openapi.json

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    name: CD - publish Docker images to GitHub Container Registry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend
      - frontend
      - docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare lowercase image namespace
        shell: bash
        run: |
          echo "IMAGE_PREFIX=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:latest
            ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
