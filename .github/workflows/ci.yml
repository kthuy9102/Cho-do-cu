name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend:
    name: Backend lint + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d testdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov httpx

      - name: Apply safe Ruff fixes
        run: ruff check --fix app/

      - name: Lint (ruff)
        run: ruff check app/

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/testdb
          JWT_SECRET_KEY: ci_secret_key_change_me_32_chars_min
          UPLOAD_DIR: /tmp/uploads
          APP_ENV: test
        run: pytest -q --cov=app --cov-report=term-missing

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - run: npm run build

  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cudo-api:ci -f Dockerfile .
      - run: docker build -t cudo-web:ci -f Dockerfile.frontend .
